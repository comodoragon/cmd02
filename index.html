<title>古漢英</title>
<style>
:root{
  --bg:#f3f3f1;--card:#fff;--fg:#141414;--mut:#6d6d69;--line:#dcdcd8;--soft:#ebebe8;
  --btn:#141414;--btnfg:#fff;--ok:#141414;--sheet:#fff;
  --ja:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --en:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e0e0e;--card:#191919;--fg:#ececea;--mut:#9a9a95;--line:#2e2e2c;--soft:#242422;--btn:#ececea;--btnfg:#111;--ok:#ececea;--sheet:#191919;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh}
.ja{font-family:var(--ja)}.en{font-family:var(--en)}
.mut{color:var(--mut)}.sm{font-size:13px}

/* badges */
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .3em;border-radius:6px;font-size:13px;font-weight:700;font-family:var(--ja);flex:none}
.lb-k{border:1.5px solid var(--fg)}
.lb-b{background:var(--fg);color:var(--bg)}
.lb-e{border:1.5px dashed var(--fg)}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.tag.k{color:var(--fg);border-color:var(--fg)}
.lv{font-size:9px;letter-spacing:1px;color:var(--mut)}

/* page */
.page{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.hd{margin-bottom:14px}
.hd h1{margin:0;font-size:26px;font-family:var(--ja);letter-spacing:.06em}
.hd .sub{color:var(--mut);font-size:13px;margin-top:2px}
.back{color:var(--mut);font-size:14px;display:block;margin-bottom:4px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.tc b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tc span{font-size:12px;color:var(--mut)}
.modes{display:grid;gap:8px;margin-bottom:8px}
.modes3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;display:block;width:100%}
.mode b{display:block;font-size:17px}
.mode span{font-size:12.5px;color:var(--mut)}
.mode.main{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.mode.main span{color:inherit;opacity:.7}
.modes3 .mode{text-align:center;padding:12px 4px}
.mode.wide{margin-bottom:8px}
.setline{font-size:12.5px;color:var(--mut);margin:10px 2px}
.warn{font-size:13px;border:1px solid var(--fg);border-radius:12px;padding:10px 12px;margin:10px 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.tabs button{text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px}
.stack{display:grid;gap:8px;margin-top:14px}

/* session */
.sess{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.x{font-size:22px;line-height:1;color:var(--mut);padding:4px 6px}
.bar{flex:1;height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);transition:width .25s}
.cnt{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.cardv{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 20px}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.head{font-size:38px;line-height:1.25;margin:14px 0 18px;word-break:break-word;letter-spacing:.02em}
.head.sm{font-size:28px;margin:6px 0 10px}
.head.en{font-size:32px;letter-spacing:0}
.qlab{font-size:13px;color:var(--mut);margin-top:14px}
.qg{font-size:22px;line-height:1.5;margin:6px 0 18px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 14px;font-size:17px;line-height:1.45;min-height:54px}
.opt:active{background:var(--soft)}
.actions{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:var(--bg)}
.btn{display:block;width:100%;text-align:center;background:var(--btn);color:var(--btnfg);border-radius:14px;padding:15px;font-size:17px;font-weight:600;border:1px solid var(--btn)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.two{display:grid;grid-template-columns:auto 1fr;gap:10px}
.two.solo{grid-template-columns:1fr}
.two .btn.ghost{padding:15px 18px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 4px;text-align:center}
.gb b{display:block;font-size:14px}
.gb span{font-size:11.5px;color:var(--mut)}
.gb.g1{border-style:dashed}
.gb.g4{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.gb.g4 span{color:inherit;opacity:.7}
.res{display:inline-block;font-weight:700;font-size:14px;border:1.5px solid var(--fg);border-radius:99px;padding:1px 12px;margin-bottom:6px}
.res.ng{border-style:dashed}

/* card body */
.ans .g{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:4px}
.meta2{font-size:13px;color:var(--mut);margin-bottom:6px}
.m{margin:6px 0 10px;padding-left:1.2em;font-size:15px}
.m li{margin:2px 0}
.ex{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.exs{font-size:17px;line-height:1.7}
.kd{font-size:15px;color:var(--mut);margin-top:2px}
.tr{font-size:14px;color:var(--mut);margin-top:2px}
.note{font-size:13.5px;background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0}
.dhead{display:flex;align-items:center;gap:8px}
.ccs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cc{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 9px;color:var(--mut)}
.errs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;font-size:12.5px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:14px}
.chip.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}

/* links */
.links{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.lt{font-size:12px;color:var(--mut);letter-spacing:.15em;margin-bottom:6px}
.lk{margin-bottom:10px}
.ln{font-size:13px;color:var(--mut);margin:2px 0 0 2px}
.et{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--fg)}
.ref{display:flex;align-items:center;gap:8px;width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ref .rh{font-size:17px;white-space:nowrap;flex:0 1 auto;min-width:0;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.ref .rg{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.hub{margin-top:10px;background:var(--soft);border-radius:12px;padding:9px 10px}
.hn{font-weight:700;font-size:14px}
.hs{font-size:13px;color:var(--mut);margin:2px 0 6px}
.hrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.chip2{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 9px;font-size:15px}

/* cards / stats */
.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ct{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(5,1fr);text-align:center}
.kv b{display:block;font-size:20px}.kv span{font-size:11px;color:var(--mut)}
.rowl{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--soft);min-width:0}
.rowl:first-of-type{border-top:0}
.rowl .r{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.rowl .ref{flex:1;width:auto}
.bars{display:flex;gap:8px;align-items:flex-end;height:100px}
.b{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mut)}
.b i{display:block;width:100%;background:var(--fg);border-radius:4px 4px 0 0;min-height:2px}
.b small{font-size:10.5px}
.search{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-bottom:6px;-webkit-appearance:none}
textarea{width:100%;font-size:16px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:8px 0;font-family:var(--ui)}
.stack2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.lst{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:6px}
.li.st-new .ref{opacity:.6}
.li.st-weak .ref{border:1.5px dashed var(--fg)}
.li.st-hall .ref{border-color:var(--fg)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:21;background:var(--sheet);border-radius:18px 18px 0 0;max-height:82vh;max-height:82dvh;display:flex;flex-direction:column;border:1px solid var(--line)}
.sh-top{display:flex;justify-content:flex-end;padding:8px 14px 0}
.sh-top .x{font-size:14px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 20px)}

</style>
</head>

<script>window.__DATA__ = {"concepts":[{"id":"neg","n":"否定","s":"古「ず・じ・まじ」＝漢「不・非・無・未」＝英 not・never・no。漢文は語順が英語と同じ(主語＋否定辞＋動詞)で、返り点で戻して「ず」と読む。"},{"id":"caus","n":"使役","s":"古「す・さす・しむ」＝漢「使・令・教・遣」＝英 make・let・have・get。「使A V」と「make A V」は語順まで一致する。"},{"id":"pass","n":"受身","s":"古「る・らる」＝漢「見・被・為A所B・於」＝英 be p.p.・get p.p.・have O p.p.。被害のニュアンスを帯びやすい点が共通。"},{"id":"rhet","n":"疑問・反語","s":"古「や・か・やは・かは」＝漢「豈・安・何・乎・哉」＝英 How could…? などの修辞疑問。形は疑問、意味は強い否定(反語)。"},{"id":"cond","n":"仮定・条件","s":"古「未然形＋ば」「まし」＝漢「若・如・苟・縦・雖」＝英 if・unless・even if・even though。仮定(未確定)と確定(事実)の区別が軸。"},{"id":"dut","n":"当然・願望・意志","s":"古「べし」「む」「まほし」＝漢「当・応・須・宜・将・欲」＝英 should・must・will・want to。再読文字の多くがここに集まる。"},{"id":"surp","n":"驚き・怪異","s":"古「あさまし・あやし・驚く」＝漢「驚・怪・異」＝英 astonish・suspicious・wonder。古語の「驚く」は現代語と意味がずれる(偽の友)。"},{"id":"emo","n":"悲哀・感動","s":"古「あはれ・かなし・憂し」＝漢「哀・憐・憂・嘆」＝英 pity・grief・poignant。「あはれ」は悲しみに限らず、しみじみ心を打つ感情全般。"},{"id":"death","n":"死・別離","s":"古「亡くなる・往ぬ」＝漢「崩・薨・卒・逝」＝英 pass away・depart。死を直接言わない婉曲表現と、身分による使い分け(漢文)が焦点。"}],"cards":[{"id":"k-zu","l":"k","t":"g","h":"ず","p":"助動詞・未然形接続","g":"打消「〜ない」","m":["活用は「ず系(ず・ず・ず・ぬ・ね)」と「ざり系(ざら・ざり・ざる・ざれ・ざれ)」の二系列","連体形「ぬ」・已然形「ね」は係り結びでも頻出"],"ex":"花咲かぬ木も、春を待つ。","tr":"花が咲かない木も、春を待つ。","lv":1,"c":["neg"],"note":"ざり系は、後ろに助動詞(き・けり・む など)が続くときに使う。"},{"id":"k-ji","l":"k","t":"g","h":"じ","p":"助動詞・未然形接続","g":"打消推量・打消意志「〜ないだろう／〜まい」","m":["打消推量「〜ないだろう」(主語が三人称)","打消意志「〜まい」(主語が一人称)"],"ex":"我は行かじ。","tr":"私は行くまい。","lv":1,"c":["neg"],"cf":["k-mazi"],"note":"「む」(推量・意志)の打消にあたる。"},{"id":"k-mazi","l":"k","t":"g","h":"まじ","p":"助動詞・終止形接続(ラ変型は連体形)","g":"打消推量・打消当然・不可能・禁止・打消意志","m":["打消推量「〜ないだろう」","打消意志「〜まい」","打消当然「〜はずがない」「〜べきでない」","不可能「〜できない」","禁止「〜てはならない」"],"ex":"かかる事は世にあるまじ。","tr":"このようなことは世にあるはずがない。","lv":1,"c":["neg"],"cf":["k-ji"],"note":"「べし」の打消にあたる。べしの六つの意味に対応して、それぞれが打消になったと考える。"},{"id":"k-eneg","l":"k","t":"g","h":"え〜ず","p":"呼応の副詞「え」＋打消","g":"〜できない(不可能)","m":["「え」は必ず打消(ず・じ・まじ・ぬ など)と呼応する","副詞「え」だけでは意味が成立しない"],"ex":"夜更けて、え眠らず。","tr":"夜が更けて、眠ることができない。","lv":1,"c":["neg"],"note":"呼応の副詞(陳述の副詞)の代表。「え〜打消」＝不可能と覚える。"},{"id":"k-tsuyu","l":"k","t":"w","h":"つゆ〜ず／さらに〜ず","p":"呼応の副詞＋打消","g":"少しも〜ない(全否定)","m":["つゆ・さらに・たえて・よに などが打消と呼応して全否定を作る","「よに〜ず」も「決して〜ない」"],"ex":"そのこと、つゆ思ひ寄らず。","tr":"そのことは少しも思いつかない。","lv":1,"c":["neg"]},{"id":"k-nanaso","l":"k","t":"g","h":"な〜そ","p":"副詞「な」＋終助詞「そ」","g":"〜するな(禁止)","m":["「な」＋連用形＋「そ」で、やわらかな禁止「〜してくれるな」","カ変は未然形「な来(こ)そ」、サ変は「なせそ」の形をとる"],"ex":"な泣きそ。","tr":"泣かないでおくれ。","lv":1,"c":["neg"],"note":"終止形に「な」を付ける禁止(終助詞)より、ていねいでやわらかい言い方。"},{"id":"k-imada","l":"k","t":"w","h":"いまだ〜ず","p":"副詞＋打消","g":"まだ〜ない","m":["「未だ」＋打消で「まだ〜ない」","漢文の再読文字「未」の訓読も同じ形になる"],"ex":"いまだ都を見ず。","tr":"まだ都を見たことがない。","lv":1,"c":["neg"]},{"id":"b-fu","l":"b","t":"w","h":"不","r":"〜ず","p":"否定辞(動詞・形容詞を否定)","g":"〜ない","m":["否定する語(動詞・形容詞)の直前に置き、「〜ず」と読む","名詞の否定は「非」、存在の否定は「無」"],"ex":"人不知而不慍。","kd":"人知らずして慍みず。","tr":"人が自分を認めてくれなくても、不満に思わない。","lv":1,"c":["neg"],"cf":["b-hi","b-mu"],"note":"使い分け：不＝動詞・形容詞、非＝名詞(〜ではない)、無＝存在(ない)。"},{"id":"b-hi","l":"b","t":"w","h":"非","r":"〜(に)あらず","p":"否定辞(名詞述語・判断の否定)","g":"〜ではない","m":["名詞を否定して「〜にあらず」と読む","「非〜也」の形で覚える"],"ex":"非吾罪也。","kd":"吾が罪に非ざるなり。","tr":"私の罪ではない。","lv":1,"c":["neg"],"cf":["b-fu","b-mu"]},{"id":"b-mu","l":"b","t":"w","h":"無","r":"なシ","p":"存在の否定","g":"ない・いない(存在しない)","m":["「無A」＝Aが存在しない(「有」の反対)","文脈によって「なかれ」と読み、禁止を表すこともある"],"ex":"天無二日。","kd":"天に二日無し。","tr":"天に太陽は二つはない。","lv":1,"c":["neg"],"cf":["b-fu","b-hi"]},{"id":"b-imada","l":"b","t":"g","h":"未","r":"いまダ〜(ず)","p":"再読文字","g":"まだ〜ない","m":["読む順：未(いまだ)→動詞(未然形)→「ず」(返って再び読む)","「未嘗〜」＝いまだ嘗て〜ず(＝一度も〜ない)"],"ex":"未嘗敗北。","kd":"未だ嘗て敗北せず。","tr":"これまで一度も負けたことがない。","lv":1,"c":["neg"],"note":"再読文字は、最初に副詞として、あとで助動詞として二度読む。"},{"id":"b-nakare","l":"b","t":"g","h":"勿・莫・毋","r":"〜(スル)コトなかレ","p":"禁止","g":"〜するな(禁止)","m":["連体形＋「こと」＋「なかれ」と読む","「莫」は「なシ」(存在の否定)とも読むので文脈で区別する"],"ex":"己所不欲、勿施於人。","kd":"己の欲せざる所は、人に施すこと勿かれ。","tr":"自分がされたくないことは、人にしてはならない。","lv":1,"c":["neg"],"note":"禁止＝勿・莫・毋。「なかれ」と読む。"},{"id":"b-part","l":"b","t":"g","h":"不常〜／不必〜／不倶〜","r":"つねニハ〜ず／かならズシモ〜ず","p":"部分否定","g":"いつも(必ずしも・ともに)〜とは限らない","m":["否定辞が副詞(常・必・倶 など)の前にあると部分否定","否定辞が副詞の後にあると全否定(必不〜＝必ず〜ない)"],"ex":"有言者不必有徳。","kd":"言有る者は必ずしも徳有らず。","tr":"立派な言葉を述べる者が、必ずしも徳があるとは限らない。","lv":2,"c":["neg"],"note":"語順が意味を変える：不必(部分)／必不(全)。"},{"id":"b-fufuku","l":"b","t":"g","h":"不復〜","r":"また〜ず","p":"否定＋副詞","g":"二度と〜ない・もはや〜ない","m":["「不復〜」＝復た〜ず。『もう二度と〜ない』","「復」は否定を伴わなければ『また〜する』"],"ex":"壮士一去兮不復還。","kd":"壮士 一たび去りて復た還らず。","tr":"壮士は一度去ったなら、二度とは帰らない。","lv":2,"c":["neg"]},{"id":"e-nolonger","l":"e","t":"w","h":"no longer / not ... any longer","p":"副詞句(否定)","g":"もはや〜ない","m":["no longer は一般動詞の前・be動詞や助動詞の後に置く","not ... any longer / any more は文末に置く形もある"],"ex":"He no longer lives in this town.","tr":"彼はもうこの町には住んでいない。","lv":1,"c":["neg"]},{"id":"e-neverseen","l":"e","t":"g","h":"have never p.p. / not ... yet","p":"現在完了(経験・未完了の否定)","g":"(今まで)〜したことがない／まだ〜していない","m":["経験の否定：have never p.p.","未完了の否定：have not p.p. yet"],"ex":"I have never seen such a sight.","tr":"そのような光景は見たことがない。","lv":1,"c":["neg"]},{"id":"e-hardly","l":"e","t":"w","h":"hardly / scarcely / barely / seldom / rarely","p":"準否定の副詞","g":"ほとんど〜ない(準否定)","m":["hardly・scarcely・barely は程度、seldom・rarely は頻度が『ほとんどない』","文頭に置くと倒置になる(Hardly had he ... when ...)"],"ex":"She could hardly believe her own eyes.","tr":"彼女は自分の目がほとんど信じられなかった。","lv":1,"c":["neg"]},{"id":"e-part","l":"e","t":"g","h":"not always / not necessarily / not all","p":"部分否定","g":"いつも(必ずしも・すべて)〜とは限らない","m":["not＋always・necessarily・all・every・both などで部分否定","no・never・none・neither は全否定"],"ex":"The rich are not always happy.","tr":"金持ちが必ずしも幸せとは限らない。","lv":1,"c":["neg"]},{"id":"e-dont","l":"e","t":"g","h":"Don't ... / must not ... / Never ...","p":"禁止","g":"〜するな・〜してはならない(禁止)","m":["Don't＋原形(口語の禁止)、must not＋原形(強い禁止)","Never＋原形はさらに強い戒め"],"ex":"You must not touch the exhibits.","tr":"展示品に触れてはならない。","lv":1,"c":["neg"]},{"id":"k-su","l":"k","t":"g","h":"す・さす","p":"助動詞・未然形接続","g":"使役「〜させる」(＋尊敬)","m":["「す」は四段・ナ変・ラ変、「さす」はそれ以外の動詞の未然形に付く","下に「給ふ」が続くと尊敬(最高敬語)になるのが原則"],"ex":"童に文を持たせけり。","tr":"子供に手紙を持たせた。","lv":1,"c":["caus"],"cf":["k-shimu"]},{"id":"k-shimu","l":"k","t":"g","h":"しむ","p":"助動詞・未然形接続","g":"使役「〜させる」(＋尊敬)・漢文訓読調","m":["すべての活用語の未然形に付く","漢文訓読調・和歌に多い。「〜をして〜しむ」の形は漢文の使役と同じ"],"ex":"人をして見せしむ。","tr":"人に見させる。","lv":1,"c":["caus"],"cf":["k-su"]},{"id":"k-setamau","l":"k","t":"g","h":"せ給ふ・させ給ふ・しめ給ふ","p":"二重敬語の形","g":"尊敬(最高敬語)／使役＋尊敬","m":["「す・さす・しむ」＋「給ふ」は、原則として最高敬語(天皇・皇后など)の尊敬","使役の対象(〜に)が示されていれば「使役＋尊敬」と読む"],"ex":"帝、大臣に歌詠ませ給ふ。","tr":"帝は、大臣に歌をお詠ませになる。","lv":2,"c":["caus"],"cf":["k-su"],"note":"「〜に」の有無が判別のカギ。最高敬語は帝など身分の最高位の人物の動作に付く。"},{"id":"b-shi","l":"b","t":"g","h":"使A〜","r":"Aヲシテ〜しム","p":"使役形","g":"Aに〜させる","m":["語順は「使＋A(人)＋動詞」。Aには「をして」を補って読む","使・令・教・遣は同じ形を作る"],"ex":"使子路問津焉。","kd":"子路をして津を問はしむ。","tr":"子路に渡し場を尋ねさせた。","lv":1,"c":["caus"],"cf":["b-rei"],"note":"読む順：使→A→動詞→「しむ」と返る。"},{"id":"b-rei","l":"b","t":"g","h":"令A〜","r":"Aヲシテ〜しム","p":"使役形","g":"Aに〜させる","m":["「使」とほぼ同義","目上が目下に命じる場面に多い"],"ex":"王令臣行。","kd":"王 臣をして行かしむ。","tr":"王は私を行かせた。","lv":1,"c":["caus"],"cf":["b-shi"]},{"id":"b-kyou","l":"b","t":"g","h":"教A〜","r":"Aヲシテ〜しム","p":"使役形","g":"Aに〜させる","m":["「おしフ」ではなく使役として読む場合がある","前後の文脈で、名詞『教(おしえ)』・動詞『教ふ』と区別する"],"ex":"母教子読書。","kd":"母 子をして書を読ましむ。","tr":"母は子に書物を読ませた。","lv":2,"c":["caus"]},{"id":"b-ken","l":"b","t":"g","h":"遣A〜","r":"Aヲ遣ハシテ〜しム","p":"使役形","g":"Aを行かせて〜させる(派遣)","m":["「遣」は『つかはス』(派遣する)の意を含む使役","人を派遣して用を果たさせる場面で使う"],"ex":"遣人問之。","kd":"人を遣はして之を問はしむ。","tr":"人をやって、これを尋ねさせた。","lv":2,"c":["caus"],"cf":["b-shi"]},{"id":"e-make","l":"e","t":"g","h":"make A do","p":"使役動詞","g":"(強制的に・自然に)Aに〜させる","m":["make＋A＋原形。受動態では to 不定詞(be made to do)","強制のほか、感情や状況が原因で自然にそうなる場合にも使う"],"ex":"The teacher made the students rewrite the essay.","tr":"先生は生徒たちにエッセイを書き直させた。","lv":1,"c":["caus"],"cf":["e-let"]},{"id":"e-let","l":"e","t":"g","h":"let A do","p":"使役動詞","g":"Aに〜させてやる(許可)","m":["let＋A＋原形(許可・放任)","受動態は作らず、be allowed to を使う"],"ex":"Her parents let her go abroad alone.","tr":"両親は彼女が一人で海外に行くのを許した。","lv":1,"c":["caus"],"cf":["e-make"]},{"id":"e-have","l":"e","t":"g","h":"have A do","p":"使役動詞","g":"Aに〜してもらう・させる(当然の役目)","m":["have＋A＋原形","目上・専門家など いや〜ない(反語)","m":["文末に「や」を補い「あに〜んや」と読む","「豈」は反語専用(単純な疑問には使わない)"],"ex":"豈可不慎乎。","kd":"豈に慎まざるべけんや。","tr":"どうして慎まずにいられようか。","lv":1,"c":["rhet"],"note":"反語の型：豈〜哉／安〜哉／何〜乎。"},{"id":"b-izukunzo","l":"b","t":"g","h":"安・焉・悪〜","r":"いづクンゾ〜ンや","p":"疑問・反語の副詞","g":"どうして〜か(反語)／どこに〜か(場所)","m":["「いづくんぞ〜んや」と読み、反語になることが多い","「いづくにか」と読めば場所を問う疑問(安在・焉在)"],"ex":"燕雀安知鴻鵠之志哉。","kd":"燕雀 安くんぞ鴻鵠の志を知らんや。","tr":"小さな鳥にどうして大きな鳥の志がわかろうか。","lv":2,"c":["rhet"]},{"id":"b-nanzo","l":"b","t":"g","h":"何〜","r":"なんゾ〜(ン)","p":"疑問詞","g":"どうして・なぜ／何(の)","m":["「なんぞ」＝理由(なぜ)・反語","「何為」「何故」＝なんすれぞ・なにゆゑぞ(理由を問う)","名詞を修飾して『何の〜』と読む場合もある"],"ex":"何不去。","kd":"何ぞ去らざる。","tr":"どうして立ち去らないのか。","lv":1,"c":["rhet"],"cf":["b-izukunzo"]},{"id":"b-ka","l":"b","t":"g","h":"〜乎／〜哉／〜耶／〜邪","r":"〜か(や)","p":"文末の助字","g":"疑問・反語・詠嘆を表す文末の助字","m":["疑問「〜か」","反語「〜か、いや〜ない」","詠嘆「〜だなあ」(哉に多い)","乎・耶・邪は疑問・反語、哉は詠嘆・反語が多い"],"ex":"賢哉回也。","kd":"賢なるかな回や。","tr":"賢いことだなあ、回(顔回)は。","lv":1,"c":["rhet"]},{"id":"b-fuekiko","l":"b","t":"g","h":"不亦〜乎","r":"また〜ずや(亦た〜ならずや)","p":"詠嘆の句形","g":"なんと〜ではないか(詠嘆)","m":["反語の形だが、意味は強い詠嘆・肯定","「亦た〜ずや」と読む"],"ex":"有朋自遠方来、不亦楽乎。","kd":"朋有り遠方より来たる、亦た楽しからずや。","tr":"友人が遠方から訪ねてくる。なんと楽しいことではないか。","lv":1,"c":["rhet"]},{"id":"b-ikan","l":"b","t":"g","h":"如何・奈何・若何","r":"いかん(セン)","p":"疑問・反語の句形","g":"どうしようか／どうすればよいか(方法・処置)","m":["「AをB如何せん」＝どうしようもない(反語)","「何如」は『どうであるか』(状態を問う)"],"ex":"虞兮虞兮奈若何。","kd":"虞や虞や若を奈何せん。","tr":"虞よ、虞よ、おまえをどうしようか。","lv":2,"c":["rhet"],"note":"項羽の『垓下歌』の一節。"},{"id":"e-howcould","l":"e","t":"g","h":"How could S + V?","p":"修辞疑問(反語)","g":"どうして〜できようか(いや、できない)","m":["形は疑問文、意味は強い否定","「How could you ...?」は非難・驚きを表す"],"ex":"How could I refuse such a kind offer?","tr":"こんな親切な申し出をどうして断れようか。","lv":1,"c":["rhet"]},{"id":"e-whoknows","l":"e","t":"g","h":"Who knows? / Who can tell? / Who cares?","p":"修辞疑問","g":"誰にもわからない・誰も気にしない","m":["Who knows ...? は『誰にもわからない』(＝No one knows)","疑問詞を使った修辞疑問は否定の意味になる"],"ex":"Who knows what the future will bring?","tr":"未来に何が起こるかなど、誰にもわからない。","lv":1,"c":["rhet"]},{"id":"e-negq","l":"e","t":"g","h":"Isn't it ...? / 縦・仮令","r":"たとヒ〜トモ","p":"仮定の逆接","g":"たとえ〜でも(仮定の逆接)","m":["「縦」「仮令」＝たとひ〜とも","「雖」(確定)との違い：縦＝仮定、雖＝事実"],"ex":"縦江東父兄憐而王我、我何面目見之。","kd":"縦ひ江東の父兄憐れみて我を王とするも、我何の面目ありて之に見えん。","tr":"たとえ江東の父老たちが哀れんで私を王としてくれても、私はどんな顔をして彼らに会えようか。","lv":2,"c":["cond"],"cf":["b-iedomo"],"note":"後半の「何の面目ありて〜ん」は反語。"},{"id":"b-iedomo","l":"b","t":"g","h":"雖","r":"〜(ト)いへどモ","p":"逆接の助字","g":"〜ではあるが・〜とはいえ(確定の逆接)","m":["「〜と雖も」と読み、事実を認めた上での逆接","仮定の「縦(たとひ)」と区別する"],"ex":"雖有嘉肴、弗食、不知其旨也。","kd":"嘉肴有りと雖も、食らはざれば、其の旨きを知らざるなり。","tr":"うまい料理があっても、食べなければ、そのうまさはわからない。","lv":1,"c":["cond"],"cf":["b-tozon"]},{"id":"b-sunawachi","l":"b","t":"g","h":"〜則…","r":"〜ば則(すなは)チ…","p":"条件・結果をつなぐ助字","g":"〜ならば…(順接の条件)","m":["「則」は条件と結果をつなぐ助字","条件句を「〜ば」と読み、「則ち」で結果を示す"],"ex":"学而不思則罔。","kd":"学びて思はざれば則ち罔し。","tr":"学ぶだけで考えなければ、はっきりとは理解できない。","lv":1,"c":["cond"]},{"id":"e-if","l":"e","t":"g","h":"if / as long as / provided (that)","p":"条件の接続詞","g":"もし〜ならば／〜しさえすれば／〜する限り","m":["as long as は条件『〜しさえすれば』(時間の『〜する間』の意もある)","provided (that)・providing (that) は『〜という条件で』"],"ex":"You will succeed as long as you keep trying.","tr":"努力し続ける限り、あなたは成功するだろう。","lv":1,"c":["cond"]},{"id":"e-unless","l":"e","t":"g","h":"unless","p":"条件の接続詞","g":"〜でない限り・もし〜でなければ","m":["unless＝if ... not(〜でない限り)","条件節の中では、未来のことも現在形で表す"],"ex":"We will go hiking unless it rains.","tr":"雨が降らない限り、ハイキングに行きます。","lv":1,"c":["cond"]},{"id":"e-evenif","l":"e","t":"g","h":"even if","p":"譲歩の接続詞","g":"たとえ〜でも(仮定の譲歩)","m":["事実かどうか不明な、仮定の話","even though は事実を認めた上での譲歩"],"ex":"Even if it rains, we will go.","tr":"たとえ雨が降っても、行きます。","lv":1,"c":["cond"],"cf":["e-eventhough"]},{"id":"e-eventhough","l":"e","t":"g","h":"even though / although / though","p":"譲歩の接続詞","g":"〜だけれども(事実の譲歩)","m":["事実(既定)を認めた上での譲歩","even if(仮定)とは区別する"],"ex":"Even though he was tired, he kept working.","tr":"彼は疲れていたけれども、働き続けた。","lv":1,"c":["cond"],"cf":["e-evenif"]},{"id":"e-ifpast","l":"e","t":"g","h":"If S + 過去形, S would 原形","p":"仮定法過去","g":"現在の事実に反する仮想(もし〜なら…だろうに)","m":["仮定法過去：If S 過去形(be動詞は were), S would / could / might 原形","現在・未来の事実に反する仮定"],"ex":"If I were a bird, I would fly to you.","tr":"もし私が鳥なら、あなたのもとへ飛んでいくのに。","lv":1,"c":["cond"],"cf":["e-ifpp"]},{"id":"e-ifpp","l":"e","t":"g","h":"If S had p.p., S would have p.p.","p":"仮定法過去完了","g":"過去の事実に反する仮想(もし〜だったら…だっただろうに)","m":["仮定法過去完了：If S had p.p., S would / could / might have p.p.","過去の事実に反する仮定"],"ex":"If I had known, I would have told you.","tr":"もし知っていたなら、あなたに伝えていたのに。","lv":1,"c":["cond"],"cf":["e-ifpast"]},{"id":"k-beshi","l":"k","t":"g","h":"べし","p":"助動詞・終止形接続(ラ変型は連体形)","g":"推量・意志・可能・当然・命令・適当","m":["推量「〜だろう」","意志「〜しよう」","可能「〜できる」","当然「〜すべきだ」","命令「〜せよ」","適当「〜のがよい」"],"ex":"人は誠実なるべし。","tr":"人は誠実であるべきだ。","lv":1,"c":["dut"],"cf":["k-mu"],"note":"六つの意味は『すいかとめて』(推・意・可・当・命・適)で覚える。"},{"id":"k-mu","l":"k","t":"g","h":"む(むず)","p":"助動詞・未然形接続","g":"推量・意志・勧誘・適当・仮定・婉曲","m":["推量「〜だろう」","意志「〜(よ)う」","勧誘「〜(し)ないか」","適当・命令「〜するのがよい」","仮定「〜としたら」","婉曲「〜ような」"],"ex":"われ行かむ。","tr":"私は行こう。","lv":1,"c":["dut"],"cf":["k-beshi"],"note":"主語が一人称なら意志、三人称なら推量、二人称なら勧誘・適当が原則。「〜む＋名詞」(連体形)は仮定・婉曲。"},{"id":"k-mahoshi","l":"k","t":"g","h":"まほし・たし・ばや・なむ","p":"願望の助動詞・助詞","g":"願望「〜たい」(なむ＝他への願望「〜てほしい」)","m":["まほし(未然形接続)・たし(連用形接続)は自分の願望","ばや(未然形接続の終助詞)も自分の願望","なむ(未然形接続の終助詞)は他者への願望「〜てほしい」"],"ex":"都へ帰らまほし。","tr":"都へ帰りたい。","lv":1,"c":["dut"],"note":"接続で見分ける：まほし＝未然形、たし＝連用形。"},{"id":"k-ntosu","l":"k","t":"g","h":"〜んとす(むとす)","p":"「む」＋「と」＋「す」","g":"〜しようとする・今にも〜しそうだ","m":["主語が人なら意志「〜しようとする」","物・自然なら「今にも〜しそうだ」","漢文の再読文字「将・且」の訓読と同じ形"],"ex":"日暮れんとす。","tr":"日が今にも暮れようとする。","lv":2,"c":["dut"]},{"id":"b-masani","l":"b","t":"g","h":"当・応","r":"まさニ〜ベシ","p":"再読文字","g":"当然「〜すべきだ」／推量「きっと〜だろう」","m":["読む順：当(まさに)→動詞→「べし」(返って再び読む)","当然「〜すべきだ」のほか、推量「きっと〜だろう」の意もある"],"ex":"人当自重。","kd":"人は当に自重すべし。","tr":"人は自重すべきである。","lv":1,"c":["dut"],"cf":["b-subekaraku"]},{"id":"b-subekaraku","l":"b","t":"g","h":"須","r":"すべからク〜ベシ","p":"再読文字","g":"〜する必要がある・〜べきだ","m":["読む順：須(すべからく)→動詞→「べし」","『すべて』の意ではない(よくある誤用)"],"ex":"行楽須及春。","kd":"行楽 須らく春に及ぶべし。","tr":"楽しみは、春のうちに済ませるべきだ。","lv":1,"c":["dut"],"cf":["b-masani","b-yoroshiku"]},{"id":"b-yoroshiku","l":"b","t":"g","h":"宜","r":"よろシク〜ベシ","p":"再読文字","g":"〜するのがよい・〜すべきだ(適当)","m":["読む順：宜(よろしく)→動詞→「べし」","「ふさわしい・適切だ」という意味が中心"],"ex":"宜早帰。","kd":"宜しく早く帰るべし。","tr":"早く帰るのがよい。","lv":2,"c":["dut"],"cf":["b-subekaraku"]},{"id":"b-masanto","l":"b","t":"g","h":"将・且","r":"まさニ〜ントす","p":"再読文字","g":"今にも〜しようとする・〜しようとする","m":["「将」「且」は『まさに〜(せ)んとす』と再読する","近い未来の動作を表す。『今にも〜しそうだ』"],"ex":"日将暮、客不至。","kd":"日将に暮れんとするも、客至らず。","tr":"日が今にも暮れようとするが、客は来ない。","lv":1,"c":["dut"]},{"id":"b-hossu","l":"b","t":"g","h":"欲","r":"〜(ント)ほっス","p":"願望","g":"〜したい・〜しようとする","m":["「〜(セ)んと欲す」と読む","願望・意志を表す。「願」「請」も近い働き"],"ex":"己欲立而立人。","kd":"己立たんと欲して人を立て。","tr":"自分が身を立てようと思えば、まず人を立ててやる。","lv":1,"c":["dut"]},{"id":"b-fuka","l":"b","t":"g","h":"可・不可","r":"〜ベシ／〜ベカラず","p":"許可・可能・当然","g":"〜してよい・〜できる・〜すべきだ(不可＝〜してはならない)","m":["可＝許可・可能・当然(「べし」と読む)","不可＝不許可・不可能・禁止(「べからず」)","不能(あたハず)は能力がない意味の不可能"],"ex":"此物不可食。","kd":"此の物は食ふべからず。","tr":"この物は食べてはならない(食べられない)。","lv":1,"c":["dut"]},{"id":"e-should","l":"e","t":"g","h":"should / ought to","p":"助動詞(義務・当然)","g":"〜すべきだ(義務・当然)","m":["should は当然・助言、ought to はやや強い道徳的義務","否定は should not / ought not to"],"ex":"You ought to apologize to her.","tr":"彼女に謝るべきだ。","lv":1,"c":["dut"],"cf":["e-must"]},{"id":"e-must","l":"e","t":"g","h":"must / have to","p":"助動詞(強い義務)","g":"〜しなければならない(強い義務)","m":["must＝話し手自身の判断による義務","have to＝外的事情による義務(過去・未来は had to / will have to)","must not は禁止、don't have to は不必要"],"ex":"I have to leave early tomorrow.","tr":"明日は早く出なければならない。","lv":1,"c":["dut"],"cf":["e-should"]},{"id":"e-better","l":"e","t":"g","h":"had better + 原形","p":"助言(強い忠告)","g":"〜したほうがよい(しないと困る)","m":["助言だが強い響きを持ち、目上には不適","否定形は had better not"],"ex":"You had better see a doctor.","tr":"医者に診てもらったほうがいい。","lv":1,"c":["dut"]},{"id":"e-want","l":"e","t":"g","h":"want to / would like to / hope to","p":"願望の表現","g":"〜したい(願望)","m":["would like to は丁寧な願望","wish は実現しにくい願望(仮定法)"],"ex":"I would like to visit Kyoto again.","tr":"もう一度京都を訪れたい。","lv":1,"c":["dut"]},{"id":"e-shall","l":"e","t":"g","h     h += '<div class="warn">バックアップ未実施' + (days === null ? '' : '（' + days + '日前）') + '。設定 → 書き出しで記録を保存できます。</div>';
  }
  if (!STORE_OK) h += '<div class="warn">この環境では学習記録を保存できません（プライベートブラウズ等）。</div>';
  h += '<nav class="tabs"><button data-act="go" data-v="stats">統計</button><button data-act="go" data-v="list">一覧</button><button data-act="go" data-v="settings">設定</button></nav></div>';
  return h;
}

/* ---------- session ---------- */
function sessionView() {
  const cur = SES.cur;
  if (!cur) return doneView();
  const c = CARD[cur.item.id], s = st(c.id);
  const pct = SES.total ? Math.round(100 * SES.done / SES.total) : 0;
  const kindTag = { new: '新規', rev: '復習', wk: '弱点', test: '確認', again: '再挑戦' }[cur.item.kind];
  let h = '<div class="sess"><div class="top"><button class="x" data-act="quit" aria-label="終了">×</button><div class="bar"><i style="width:' + pct + '%"></i></div><span class="cnt">' + SES.done + '/' + SES.total + '</span></div>';
  h += '<div class="cardv"><div class="meta">' + badge(c.l) + '<span class="tag">' + TN[c.t] + '</span>' + dots(c.lv) + '<span class="tag k">' + kindTag + '</span></div>';
  const rev = cur.fmt === 'rev' && cur.q && cur.q.dir === 'r';
  if (rev && cur.phase === 'q') h += '<div class="qlab">この意味にあたる語は？</div><div class="qg">' + esc(c.g) + '</div>';
  else h += headHTML(c, cur.phase === 'a' ? 'sm' : '');
  if (cur.phase === 'q' && cur.fmt === 'mcq' || (cur.phase === 'q' && rev)) {
    h += '<div class="opts">' + cur.q.opts.map(function (o, i) {
      return '<button class="opt ' + (rev ? (c.l === 'e' ? 'en' : 'ja') : '') + '" data-act="pick" data-i="' + i + '">' + esc(o.v) + '</button>';
    }).join('') + '</div>';
  }
  if (cur.phase === 'a') {
    if (cur.result !== null && cur.fmt !== 'learn') {
      h += '<div class="res ' + (cur.result ? 'ok' : 'ng') + '">' + (cur.result ? '正解' : '不正解') + '</div>';
    }
    h += bodyHTML(c);
    if (showLinks(c.id)) h += linksHTML(c.id);
    if (cur.result === false) {
      h += '<div class="errs"><span>ミスの種類（任意）</span>' + [['知らなかった', 1], ['うろ覚え', 2], ['混同した', 3], ['読み違い', 4]].map(function (e) {
        return '<button class="chip' + (cur.err === e[1] ? ' on' : '') + '" data-act="err" data-e="' + e[1] + '">' + e[0] + '</button>';
      }).join('') + '</div>';
    }
  }
  h += '</div><div class="actions">';
  if (cur.phase === 'q' && cur.fmt === 'flip') {
    h += '<button class="btn" data-act="reveal">答えを見る</button>';
  } else if (cur.phase === 'q') {
    h += '<button class="btn ghost" data-act="dontknow">わからない</button>';
  } else if (cur.fmt === 'learn') {
    h += '<button class="btn" data-act="learned">次へ</button>';
  } else if (cur.fmt === 'flip') {
    const now = Date.now();
    h += '<div class="gr">' + [[1, 'もう一度'], [2, '難しい'], [3, '良い'], [4, '簡単']].map(function (g) {
      return '<button class="gb g' + g[0] + '" data-act="grade" data-g="' + g[0] + '"><b>' + g[1] + '</b><span>' + previewGrade(s, g[0], now) + '</span></button>';
    }).join('') + '</div>';
  } else {
    h += '<div class="two' + (cur.result ? '' : ' solo') + '">' + (cur.result ? '<button class="btn ghost" data-act="unsure">自信なし</button>' : '') + '<button class="btn" data-act="next">次へ</button></div>';
  }
  h += '</div></div>';
  return h;
}
function doneView() {
  const n = SES.done, acc = n ? Math.round(100 * SES.ok / n) : 0;
  const P = poolInfo(SES.mode === 'weak' ? 'weak' : 'mix', Date.now());
  let h = '<div class="page"><header class="hd"><h1>' + (SES.total ? 'おつかれさま' : '今日の分は完了') + '</h1></header>';
  if (SES.total) {
    h += '<div class="today"><div class="tc"><b>' + n + '</b><span>回答</span></div><div class="tc"><b>' + acc + '%</b><span>正答率</span></div><div class="tc"><b>' + SES.nNew + '</b><span>新規</span></div></div>';
  } else {
    h += '<p class="mut">出題できるカードがありません。</p>';
  }
  h += '<div class="stack">';
  if (P.fresh.length) h += '<button class="mode wide" data-act="moreNew"><b>新規をあと10枚学ぶ</b><span>未学習 ' + P.fresh.length + '枚</span></button>';
  h += '<button class="mode wide" data-act="again"><b>続ける</b><span>同じモードでもう1回</span></button>';
  h += '<button class="mode wide" data-act="home"><b>ホームへ</b></button></div></div>';
  return h;
}

/* ---------- stats ---------- */
function pct(a, b) { return b ? Math.round(100 * a / b) + '%' : '—'; }
function statsView() {
  const now = Date.now();
  const cnt = { new: 0, learn: 0, review: 0, weak: 0, hall: 0 };
  const byL = { k: { n: 0, seen: 0 }, b: { n: 0, seen: 0 }, e: { n: 0, seen: 0 } };
  DATA.cards.forEach(function (c) {
    const sc = stateOf(c.id); cnt[sc]++; byL[c.l].n++; if (sc !== 'new') byL[c.l].seen++;
  });
  const t7 = now - 7 * DAY;
  const rows = LOG.filter(function (r) { return r[0] >= t7; });
  const rev = rows.filter(function (r) { return r[2] === 2; });
  const acc = {}; ['k', 'b', 'e'].forEach(function (l) { acc[l] = [0, 0]; });
  rev.forEach(function (r) { const l = CARD[r[1]] && CARD[r[1]].l; if (!l) return; acc[l][1]++; if (r[4] >= 3) acc[l][0]++; });
  const ab = { 0: [0, 0], 1: [0, 0] };
  LOG.forEach(function (r) { if (r[2] === 2 && (r[6] === 0 || r[6] === 1)) { ab[r[6]][1]++; if (r[4] >= 3) ab[r[6]][0]++; } });
  const mx = [0, 0], sg = [0, 0];
  LOG.forEach(function (r) { if (r[2] === 2) { const t = (r[8] === 'mix' || r[8] === 'chain') ? mx : ((r[8] === 'k' || r[8] === 'b' || r[8] === 'e') ? sg : null); if (t) { t[1]++; if (r[4] >= 3) t[0]++; } } });
  const days = []; for (let i = 6; i >= 0; i--) { const d0 = startOfDay(now - i * DAY); days.push([d0, LOG.filter(function (r) { return r[0] >= d0 && r[0] < d0 + DAY; }).length]); }
  const maxd = Math.max(1, Math.max.apply(null, days.map(function (x) { return x[1]; })));
  let h = '<div class="page"><header class="hd"><button class="back" data-act="home">‹ ホーム</button><h1>統計</h1></header>';
  h += '<div class="card2"><div class="ct">状態</div><div class="kv">' + ['new', 'learn', 'review', 'weak', 'hall'].map(function (k) { return '<div><b>' + cnt[k] + '</b><span>' + STATE_LABEL[k] + '</span></div>'; }).join('') + '</div></div>';
  h += '<div class="card2"><div class="ct">言語別（学習済み／全体、直近7日の復習正答率）</div>' + ['k', 'b', 'e'].map(function (l) {
    return '<div class="rowl">' + badge(l) + '<span>' + byL[l].seen + ' / ' + byL[l].n + '</span><span class="r">' + pct(acc[l][0], acc[l][1]) + ' <small>(' + acc[l][1] + ')</small></span></div>';
  }).join('') + '</div>';
  h += '<div class="card2"><div class="ct">直近7日の回答数</div><div class="bars">' + days.map(function (d) {
    return '<div class="b"><i style="height:' + Math.round(60 * d[1] / maxd) + 'px"></i><span>' + (new Date(d[0]).getMonth() + 1) + '/' + new Date(d[0]).getDate() + '</span><small>' + d[1] + '</small></div>';
  }).join('') + '</div></div>';
  h += '<div class="card2"><div class="ct">実験ログ（復習の正答率）</div>';
  h += '<div class="rowl"><span>つながり表示あり</span><span class="r">' + pct(ab[1][0], ab[1][1]) + ' <small>(' + ab[1][1] + ')</small></span></div>';
  h += '<div class="rowl"><span>つながり表示なし</span><span class="r">' + pct(ab[0][0], ab[0][1]) + ' <small>(' + ab[0][1] + ')</small></span></div>';
  h += '<div class="rowl"><span>混合モード（ミックス・連鎖）</span><span class="r">' + pct(mx[0], mx[1]) + ' <small>(' + mx[1] + ')</small></span></div>';
  h += '<div class="rowl"><span>単言語モード</span><span class="r">' + pct(sg[0], sg[1]) + ' <small>(' + sg[1] + ')</small></span></div>';
  h += '<p class="mut sm">括弧内は回答数。数百件たまるまでは参考値です。表示あり/なしは新規カードごとにランダム割り当て（設定でオフにできます）。</p></div>';
  const wk = DATA.cards.filter(function (c) { return stateOf(c.id) === 'weak'; }).sort(function (a, b) { return failScore(b.id) - failScore(a.id); }).slice(0, 12);
  h += '<div class="card2"><div class="ct">弱点カード</div>' + (wk.length ? wk.map(function (c) { return '<div class="rowl">' + miniRef(c.id) + '<span class="r">誤答 ' + (st(c.id).hist.match(/1/g) || []).length + '</span></div>'; }).join('') : '<p class="mut sm">まだありません。</p>') + '</div></div>';
  return h;
}

/* ---------- list ---------- */
let LF = { l: 'all', st: 'all', q: '' };
function listView() {
  const q = LF.q.trim().toLowerCase();
  const rows = DATA.cards.filter(function (c) {
    if (LF.l !== 'all' && c.l !== LF.l) return false;
    if (LF.st !== 'all' && stateOf(c.id) !== LF.st) return false;
    if (q && (c.h + ' ' + c.g + ' ' + (c.r || '') + ' ' + (c.m || []).join(' ')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  let h = '<div class="page"><header class="hd"><button class="back" data-act="home">‹ ホーム</button><h1>一覧</h1></header>';
  h += '<input class="search" id="q" type="search" placeholder="検索（見出し・意味）" value="' + esc(LF.q) + '">';
  h += '<div class="chips">' + [['all', 'すべて'], ['k', '古'], ['b', '漢'], ['e', '英']].map(function (x) { return '<button class="chip' + (LF.l === x[0] ? ' on' : '') + '" data-act="lf" data-k="l" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="chips">' + [['all', '全状態'], ['new', '未学習'], ['learn', '学習中'], ['review', '復習'], ['weak', '弱点'], ['hall', '殿堂入り']].map(function (x) { return '<button class="chip' + (LF.st === x[0] ? ' on' : '') + '" data-act="lf" data-k="st" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="mut sm">' + rows.length + '件</div><div class="lst">';
  rows.slice(0, 300).forEach(function (c) { h += '<div class="li st-' + stateOf(c.id) + '">' + miniRef(c.id) + '</div>'; });
  if (rows.length > 300) h += '<div class="mut sm">先頭300件を表示。検索で絞り込んでください。</div>';
  h += '</div></div>';
  return h;
}

/* ---------- settings ---------- */
let CONFIRM_RESET = false, IO_MSG = '';
function settingsView() {
  const sopt = function (key, vals, unit) {
    return '<div class="chips">' + vals.map(function (v) { return '<button class="chip' + (S.set[key] === v ? ' on' : '') + '" data-act="set" data-k="' + key + '" data-v="' + v + '">' + v + unit + '</button>'; }).join('') + '</div>';
  };
  let h = '<div class="page"><header class="hd"><button class="back" data-act="home">‹ ホーム</button><h1>設定</h1></header>';
  h += '<div class="card2"><div class="ct">1回の問題数</div>' + sopt('len', [15, 30, 50, 80], '問') + '</div>';
  h += '<div class="card2"><div class="ct">新規カード（1日の上限）</div>' + sopt('newPerDay', [5, 10, 15, 20, 30], '枚') + '</div>';
  h += '<div class="card2"><div class="ct">対象レベル</div><div class="chips">' + [[1, '標準'], [2, '発展'], [3, '高度']].map(function (x) { return '<button class="chip' + (S.set.lv.indexOf(x[0]) >= 0 ? ' on' : '') + '" data-act="lv" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div></div>';
  h += '<div class="card2"><div class="ct">実験モード</div><div class="chips"><button class="chip' + (S.set.exp ? ' on' : '') + '" data-act="exp" data-v="1">ON（半数のカードでつながり非表示）</button><button class="chip' + (!S.set.exp ? ' on' : '') + '" data-act="exp" data-v="0">OFF（常に表示）</button></div><p class="mut sm">ONの間に新しく学ぶカードだけがランダムに振り分けられます。OFFにしても割り当て済みのカードの記録は残ります。</p></div>';
  h += '<div class="card2"><div class="ct">バックアップ</div><div class="stack2"><button class="btn ghost" data-act="exportCopy">記録をコピー</button><button class="btn ghost" data-act="exportFile">ファイルとして保存</button></div><textarea id="imp" rows="3" placeholder="ここに書き出した記録を貼り付けて読み込み"></textarea><button class="btn ghost" data-act="import">貼り付けた記録を読み込む</button>' + (IO_MSG ? '<p class="mut sm">' + esc(IO_MSG) + '</p>' : '') + '<p class="mut sm">Safariで開いている場合、長期間アクセスしないと記録が消えることがあります。ホーム画面に追加して使うと安定します（記録は追加前と別扱いになるので、先にバックアップを）。</p></div>';
  h += '<div class="card2"><div class="ct">リセット</div>' + (CONFIRM_RESET ? '<button class="btn danger" data-act="reset2">本当に全記録を消す</button> <button class="btn ghost" data-act="reset0">やめる</button>' : '<button class="btn ghost" data-act="reset1">学習記録をリセット</button>') + '</div></div>';
  return h;
}

/* ---------- sheet ---------- */
function sheetHTML() {
  if (!SHEET) return '';
  return '<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet"><div class="sh-top"><button class="x" data-act="closeSheet">閉じる</button></div><div class="sh-body">' + fullDetail(SHEET.id) + '</div></div>';
}

/* ---------- render ---------- */
function render() {
  let h = '';
  const v = VIEW.name;
  if (v === 'home') h = homeView();
  else if (v === 'session') h = sessionView();
  else if (v === 'stats') h = statsView();
  else if (v === 'list') h = listView();
  else if (v === 'settings') h = settingsView();
  APP.innerHTML = h + sheetHTML();
  const sc = APP.querySelector('.cardv');
  if (sc && VIEW._scroll) { sc.scrollTop = 0; VIEW._scroll = false; }
  document.body.classList.toggle('lock', !!SHEET);
}
function go(name) { VIEW = { name: name }; SHEET = null; window.scrollTo(0, 0); render(); }
function nextCard() {
  const cur = pickNext();
  VIEW = { name: 'session', _scroll: true };
  if (!cur) SES.cur = null;
  render();
}
function downloadText(name, text) {
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}
function exportJSON() { return JSON.stringify({ app: 'kokan-ei', v: 1, at: Date.now(), state: S, log: LOG }); }
function markBackup() { S.bk = Date.now(); saveState(); }

/* ---------- events ---------- */
APP.addEventListener('click', function (ev) {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.getAttribute('data-act');
  const d = el.dataset;
  const cur = SES && SES.cur;
  switch (a) {
    case 'start': startSession(d.mode); nextCard(); break;
    case 'go': go(d.v); break;
    case 'home': go('home'); break;
    case 'quit': SES && (SES.cur = null); go('home'); break;
    case 'again': startSession(SES.mode); nextCard(); break;
    case 'moreNew': S.day.x = (S.day.x || 0) + 10; saveState(); startSession(SES.mode === 'weak' ? 'mix' : SES.mode); nextCard(); break;
    case 'reveal': cur.phase = 'a'; cur.ms = Date.now() - cur.t0; render(); break;
    case 'learned': finishLearn(); nextCard(); break;
    case 'grade': recordAnswer(parseInt(d.g, 10), cur.ms || (Date.now() - cur.t0), 0); nextCard(); break;
    case 'pick': {
      if (cur.phase !== 'q') break;
      const o = cur.q.opts[parseInt(d.i, 10)];
      cur.ms = Date.now() - cur.t0; cur.picked = parseInt(d.i, 10); cur.result = !!o.ok; cur.phase = 'a';
      const s = st(cur.item.id);
      cur.g = autoGrade(cur.result, cur.ms, s, cur.item.kind);
      cur.recorded = false; cur.err = null;
      /* 記録は「次へ」で確定（自信なし・ミス種別の反映のため） */
      render(); break;
    }
    case 'dontknow': cur.ms = Date.now() - cur.t0; cur.result = false; cur.phase = 'a'; cur.g = 1; cur.err = null; render(); break;
    case 'err': cur.err = (cur.err === parseInt(d.e, 10)) ? null : parseInt(d.e, 10); render(); break;
    case 'unsure': cur.g = 2; recordAnswer(2, cur.ms, 0); nextCard(); break;
    case 'next': recordAnswer(cur.g, cur.ms, cur.err); nextCard(); break;
    case 'sheet': SHEET = { id: d.id }; render(); break;
    case 'closeSheet': SHEET = null; render(); break;
    case 'lf': LF[d.k] = d.v; render(); break;
    case 'set': S.set[d.k] = parseInt(d.v, 10); saveState(); render(); break;
    case 'lv': {
      const v = parseInt(d.v, 10), i = S.set.lv.indexOf(v);
      if (i >= 0) { if (S.set.lv.length > 1) S.set.lv.splice(i, 1); } else S.set.lv.push(v);
      saveState(); render(); break;
    }
    case 'exp': S.set.exp = d.v === '1'; saveState(); render(); break;
    case 'exportCopy': {
      const txt = exportJSON(); markBackup();
      const done = function (ok) { IO_MSG = ok ? '記録をクリップボードにコピーしました。メモ等に貼って保管してください。' : 'コピーできませんでした。「ファイルとして保存」を使ってください。'; render(); };
      try { navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
      break;
    }
    case 'exportFile': { const ok = downloadText('kokan-ei-' + dayKey(Date.now()) + '.json', exportJSON()); markBackup(); IO_MSG = ok ? '保存を開始しました。' : '保存できませんでした。'; render(); break; }
    case 'import': {
      const ta = document.getElementById('imp'); let obj = null;
      try { obj = JSON.parse(ta.value); } catch (e) { obj = null; }
      if (obj && obj.state && obj.state.cards) { S = obj.state; LOG = Array.isArray(obj.log) ? obj.log : []; loadMerge(); saveState(); saveLog(); IO_MSG = '読み込みました（カード ' + Object.keys(S.cards).length + '件）。'; }
      else IO_MSG = '読み込めませんでした。書き出した記録をそのまま貼り付けてください。';
      render(); break;
    }
    case 'reset1': CONFIRM_RESET = true; render(); break;
    case 'reset0': CONFIRM_RESET = false; render(); break;
    case 'reset2': S = defaults(); LOG = []; saveState(); saveLog(); CONFIRM_RESET = false; IO_MSG = '';  render(); break;
  }
});
APP.addEventListener('input', function (ev) {
  if (ev.target && ev.target.id === 'q') {
    LF.q = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { } }
  }
});
function loadMerge() {
  const d = defaults();
  S.set = Object.assign({}, d.set, S.set || {});
  S.day = Object.assign({}, d.day, S.day || {});
  rollDay();
}

'use strict';
/* ===== main ===== */
(function () {
  loadAll();
  saveState();
  render();
  // 日付をまたいで開きっぱなしの場合に備え、復帰時にホームを更新
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && VIEW.name === 'home' && !SHEET) { rollDay(); render(); }
  });
})();


</script>
</body>
</html>
